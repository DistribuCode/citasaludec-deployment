name: 🚀 Deploy Docker Compose

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: ⛔ DEBUG: Show root files before SCP
        run: |
          echo "Current Directory: $(pwd)"
          ls -l
          echo "== Try to show docker-compose.yml in root =="
          cat docker-compose.yml || echo "NO docker-compose.yml in root"
          echo "== Try to show deployment/docker-compose.yml =="
          cat deployment/docker-compose.yml || echo "NO docker-compose.yml in deployment/"

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🧹 Clean previous files on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🧹 Cleaning old docker-compose.yml..."
            rm -rf ~/deploy
            mkdir -p ~/deploy

      - name: 📂 Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "~/deploy"

      - name: 🗂 List files on EC2 after SCP (debug)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            ls -l ~/deploy
            cat ~/deploy/docker-compose.yml || echo "docker-compose.yml not found in ~/deploy"

      - name: 🚀 Install Docker and Compose + Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🐳 Installing Docker..."
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ec2-user
            docker version

            echo "🔧 Installing Docker Compose v2.24.6 as CLI plugin..."
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-$(uname -s)-$(uname -m) -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            docker compose version

            echo "🚀 Deploying services with docker compose..."
            cd ~/deploy
            ls -l
            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml NOT FOUND"
              exit 1
            fi
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d