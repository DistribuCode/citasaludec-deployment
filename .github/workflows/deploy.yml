name: 🚀 Deploy Docker Compose

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🧹 Clean previous docker-compose file on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🧹 Removing old docker-compose.yml if exists..."
            rm -rf ~/deploy/docker-compose.yml
            mkdir -p ~/deploy

      - name: 📂 Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "deployment/docker-compose.yml"
          target: "~/deploy"

      - name: 👀 Verify file exists on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "✅ Contents of ~/deploy:"
            ls -l ~/deploy
            echo "✅ docker-compose.yml content:"
            cat ~/deploy/docker-compose.yml || echo "❌ File not found!"

      - name: 🚀 Run Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🔧 Installing Docker Compose v2.24.6 as Docker CLI plugin..."
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-$(uname -s)-$(uname -m) -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            docker compose version

            echo "🚀 Deploying services..."
            cd ~/deploy
            ls -l
            cat docker-compose.yml
            docker compose pull
            docker compose up -d
