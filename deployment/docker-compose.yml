version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - my_network

  auth-db:
    image: postgres:15
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - my_network

  auth-service:
    image: jeffri1997/auth-service:latest
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: auth_db
      JWT_SECRET: supersecretkey
      AMQP_URL: amqp://rabbitmq
    depends_on:
      - auth-db
      - rabbitmq
    networks:
      - my_network

  registration-db:
    image: postgres:15
    container_name: registration-db
    restart: always
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - registration_data:/var/lib/postgresql/data
    networks:
      - my_network

  user-registration:
    image: jeffri1997/user-registration:latest
    container_name: user-registration
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DB_HOST: registration-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: users_db
      BCRYPT_SALT_ROUNDS: 10
      AMQP_URL: amqp://rabbitmq
    depends_on:
      - registration-db
      - rabbitmq
    networks:
      - my_network

  user-db:
    image: mongo:6.0
    container_name: user-db
    restart: always
    volumes:
      - user_data:/data/db
    networks:
      - my_network

  user-service:
    image: jeffri1997/user-service:latest
    container_name: user-service
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGO_URI: mongodb://user-db:27017/users
      JWT_SECRET: supersecretkey
    depends_on:
      - user-db
    networks:
      - my_network

  appointment-db:
    image: postgres:15
    container_name: appointment-db
    restart: always
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - appointment_data:/var/lib/postgresql/data
    networks:
      - my_network

  appointment-service:
    image: jeffri1997/appointment-service:latest
    container_name: appointment-service
    ports:
      - "4007:4007"
    environment:
      PORT: 4007
      DB_HOST: appointment-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: appointment_db
      JWT_SECRET: supersecretkey
      AMQP_URL: amqp://rabbitmq
    depends_on:
      - appointment-db
    networks:
      - my_network

  cancel-appointment-db:
    image: postgres:15
    container_name: cancel-appointment-db
    restart: always
    environment:
      POSTGRES_DB: cancel_appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - cancel_appointment_data:/var/lib/postgresql/data
    networks:
      - my_network

  cancel-appointment-service:
    image: jeffri1997/cancel-appointment-serv:latest
    container_name: cancel-appointment-service
    ports:
      - "4008:4008"
    environment:
      PORT: 4008
      DB_HOST: cancel-appointment-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: cancel_appointment_db
      JWT_SECRET: supersecretkey
    depends_on:
      - cancel-appointment-db
    networks:
      - my_network

  availability-db:
    image: mongo:6.0
    container_name: availability-db
    restart: always
    volumes:
      - availability_data:/data/db
    networks:
      - my_network

  availability-service:
    image: jeffri1997/availability-service:latest
    container_name: availability-service
    ports:
      - "4010:4010"
    environment:
      PORT: 4010
      MONGO_URI: mongodb://availability-db:27017/availability
      JWT_SECRET: supersecretkey
    depends_on:
      - availability-db
    networks:
      - my_network

  logs-service:
    image: jeffri1997/logs-service:latest
    container_name: logs-service
    ports:
      - "5005:4011"
    environment:
      PORT: 4011
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: mysecrettoken
      INFLUX_ORG: myorg
      INFLUX_BUCKET: audit_events
      JWT_SECRET: supersecretkey
    depends_on:
      - influxdb
    networks:
      - my_network

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpass
      - DOCKER_INFLUXDB_INIT_ORG=myorg
      - DOCKER_INFLUXDB_INIT_BUCKET=audit_events
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mysecrettoken
    volumes:
      - influx_data:/var/lib/influxdb2
    networks:
      - my_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - my_network

  api-gateway:
    image: jeffri1997/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - user-service
      - user-registration
      - appointment-service
      - cancel-appointment-service
      - availability-service
      - logs-service
    networks:
      - my_network

volumes:
  auth_data:
  registration_data:
  user_data:
  appointment_data:
  cancel_appointment_data:
  availability_data:
  influx_data:

networks:
  my_network:
    driver: bridge

