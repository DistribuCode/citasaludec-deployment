name: 🚀 Deploy Docker Compose

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📦 Zip docker-compose.yml
        run: |
          mkdir -p deployment_zip
          cp deployment/docker-compose.yml deployment_zip/
          cd deployment_zip
          zip docker-compose.zip docker-compose.yml

      - name: 🧹 Clean previous files on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🧹 Cleaning old deployment files..."
            rm -rf ~/deploy
            mkdir -p ~/deploy

      - name: 📂 Copy zipped docker-compose to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "deployment_zip/docker-compose.zip"
          target: "~/deploy"

      - name: 🚀 Install Docker and Compose + Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🐳 Installing Docker and unzip..."
            sudo yum update -y
            sudo yum install -y docker unzip
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ec2-user
            docker version

            echo "🔧 Installing Docker Compose v2.24.6 as CLI plugin..."
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -SL https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-$(uname -s)-$(uname -m) -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            docker compose version

            echo "📦 Unzipping docker-compose.yml..."
            cd ~/deploy
            unzip -o docker-compose.zip

            echo "🚀 Deploying services with docker compose..."
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d
